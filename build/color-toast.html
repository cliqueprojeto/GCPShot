<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
  <title>GCPShot - Cor copiada</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #151923; color: #edf0f7; border: 1px solid #7d87d8; border-radius: 7px; font: 13px/1.5 'Segoe UI', sans-serif; overflow: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; }
    #open { display: block; width: 100%; padding: 15px 18px; border: 0; background: none; text-align: left; }
    #open:hover { background: #22283a; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; color: #bfc9e3; }
    header img { width: 21px; height: 21px; }
    .row { display: flex; align-items: center; gap: 12px; }
    #swatch { width: 34px; height: 34px; border: 1px solid #ffffff55; border-radius: 4px; flex-shrink: 0; }
    strong { display: block; font-size: 14px; font-weight: 600; }
    small { display: block; color: #b6c5ed; margin-top: 7px; }
    #dismiss { position: absolute; top: 7px; right: 9px; background: transparent; border: 0; font-size: 20px; padding: 0 6px; }
    button:focus-visible { outline: 2px solid #a9baff; outline-offset: -3px; }
  </style>
</head>
<body>
  <button id="open" aria-label="Abrir Color Lab">
    <header><img src="icon-32.png" alt=""><span id="brand">GCPShot / Live Color</span></header>
    <div class="row"><span id="swatch"></span><div><strong id="hex"></strong><span id="description">Cor copiada para a área de transferência</span></div></div>
    <small id="action">Abrir no Color Lab</small>
  </button>
  <button id="dismiss" aria-label="Fechar notificação">×</button>
  <script src="color-toast.js"></script>
</body>
</html>
