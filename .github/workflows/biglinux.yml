name: Build BigLinux Package
on:
  push:
    branches: ['codex/cross-platform-installers']
    paths: ['packaging/arch/**', 'scripts/build-test-arch.sh', '.github/workflows/biglinux.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Download approved Linux 0.7.0 payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41445682412 --repo "$GITHUB_REPOSITORY" --name GCPShot-linux-x64 --dir release/linux-approved
      - run: npm ci
      - run: npm test
      - name: Install test runner
        run: npm install --no-save --package-lock=false playwright
      - name: Build and install native Arch package
        run: docker run --rm --shm-size=1g -v "$PWD:/work" -w /work archlinux:base-devel bash scripts/build-test-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GCPShot-BigLinux-x86_64
          path: release/BigLinux/*.pkg.tar.zst
          if-no-files-found: error
