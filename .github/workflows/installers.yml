name: Build Installers
on:
  push:
    branches: ['main', 'release/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GCPSHOT_DISABLE_UPDATES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb xdotool x11-xserver-utils x11-utils rpm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test macOS picker input and recovery
        if: matrix.platform == 'mac'
        run: node scripts/test-macos-picker.cjs
      - name: Test Linux picker
        if: matrix.platform == 'linux'
        run: xvfb-run -a -s '-screen 0 1280x800x24 -noreset' node scripts/test-linux-picker.cjs
      - name: Test Linux silent screenshot fallback
        if: matrix.platform == 'linux'
        run: |
          set +e
          dbus-run-session -- build/GCPShot.LiveColor --screenshot /tmp/gcpshot-shot.png
          status=$?
          set -e
          # No KWin or portal on the runner: the helper must fail cleanly (exit 1) without hanging or crashing.
          test "$status" -eq 1
      - name: Package installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Inspect Debian package
        if: matrix.platform == 'linux'
        run: |
          dpkg-deb --info release/*.deb
          sudo apt-get install -y ./release/*.deb
      - name: Inspect macOS bundle
        if: matrix.platform == 'mac'
        run: |
          find release -name GCPShot.LiveColor -exec file {} \;
          helper=$(find release -name GCPShot.LiveColor -print -quit)
          test -n "$helper"
          node scripts/test-macos-picker.cjs "$helper"
          hdiutil verify release/*.dmg
      - name: Install smoke test runner
        run: npm install --no-save --package-lock=false playwright
      - name: Test installed Linux application
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/test-packaged.cjs
      - name: Test RPM installed on Fedora
        if: matrix.platform == 'linux'
        run: docker run --rm --shm-size=1g -e GCPSHOT_DISABLE_UPDATES=1 -v "$PWD:/work" -w /work fedora:43 bash scripts/test-fedora-rpm.sh
      - name: Test packaged macOS application
        if: matrix.platform == 'mac'
        run: node scripts/test-packaged.cjs
      - name: Test packaged Windows application
        if: matrix.platform == 'win'
        run: node scripts/test-packaged.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: GCPShot-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.deb
            release/*.rpm
            release/*.exe
          if-no-files-found: error

  arch:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GCPSHOT_DISABLE_UPDATES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: GCPShot-linux-x64
          path: release/linux-approved
      - run: npm ci
      - name: Install test runner
        run: npm install --no-save --package-lock=false playwright
      - name: Build and install native Arch / BigLinux package
        run: docker run --rm --shm-size=1g -e GCPSHOT_DISABLE_UPDATES=1 -v "$PWD:/work" -w /work archlinux:base-devel bash scripts/build-test-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GCPShot-BigLinux-x86_64
          path: release/BigLinux/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, arch]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create update manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="RELEASE-NOTES-${version}.md"
          test -f "$notes"
          node scripts/make-update-manifest.cjs artifacts "$GITHUB_REF_NAME" "$notes"
          ls -la artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "GCPShot ${version}" --notes-file "RELEASE-NOTES-${version}.md" --verify-tag "${flags[@]}"
