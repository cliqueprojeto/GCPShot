name: Build Installers
on:
  push:
    branches: ['codex/cross-platform-installers']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb xdotool
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Inspect Debian package
        if: matrix.platform == 'linux'
        run: dpkg-deb --info release/*.deb && dpkg-deb --contents release/*.deb
      - name: Inspect macOS bundle
        if: matrix.platform == 'mac'
        run: |
          find release -name GCPShot.LiveColor -exec file {} \;
          hdiutil verify release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: GCPShot-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.deb
          if-no-files-found: error
